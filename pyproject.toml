[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent-cooperation"
version = "0.1.0"
description = "A modular, reproducible multi-agent simulation environment for studying emergent cooperation under different information, communication, and disturbance conditions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "lil", email = "loonaarc@gmail.com" }]
keywords = [
    "multi-agent-systems",
    "emergent-cooperation",
    "common-pool-resource",
    "self-organization",
    "resilience",
    "agent-based-simulation",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "scipy>=1.11"]
notebook = ["jupyterlab>=4.0", "ipywidgets>=8.1", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
emergent-coop = "emergent_cooperation.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213", "D105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# Notebooks pack matplotlib calls onto one line (a1.set_xlabel(...); a1.set_ylabel(...))
# and skip module docstrings — both are conventional for exploratory cells.
"*.ipynb" = ["D", "E702"]

[tool.ruff.lint.pydocstyle]
convention = "google"
